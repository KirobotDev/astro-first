name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de votre dépôt
        uses: actions/checkout@v4

      - name: Installation, build et upload de votre site
        uses: withastro/action@v3
        with:
          node-version: 24
          package-manager: npm
